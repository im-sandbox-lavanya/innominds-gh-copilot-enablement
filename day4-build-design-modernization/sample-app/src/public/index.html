<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Dashboard — ECommerce API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ─── Design Tokens ─────────────────────────────────────── */
    :root {
      --bg-base:     #080c18;
      --bg-surface:  #0f1629;
      --bg-raised:   #161e35;
      --bg-hover:    #1c2641;
      --border:      #1f2d4a;
      --border-light:#2a3d60;
      --accent:      #3b82f6;
      --accent-glow: rgba(59,130,246,0.18);
      --text-primary:#e8edf8;
      --text-muted:  #6b7fa8;
      --text-dim:    #3f5278;
      --green:       #10b981;
      --amber:       #f59e0b;
      --red:         #ef4444;
      --purple:      #8b5cf6;
      --cyan:        #06b6d4;
      --font-sans:   'Space Grotesk', sans-serif;
      --font-mono:   'JetBrains Mono', monospace;
      --radius:      6px;
      --radius-lg:   10px;
    }

    /* ─── Reset & Base ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }
    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.55;
    }
    button { cursor: pointer; font-family: inherit; }
    input, select, textarea { font-family: inherit; }

    /* ─── Layout ────────────────────────────────────────────── */
    .app-shell {
      display: grid;
      grid-template-rows: 56px 1fr;
      min-height: 100vh;
    }

    /* ─── Header ────────────────────────────────────────────── */
    .header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      text-decoration: none;
    }
    .header-brand .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .header-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 3px 8px;
      letter-spacing: 0.06em;
    }

    /* ─── Main ──────────────────────────────────────────────── */
    .main {
      padding: 32px 28px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    /* ─── Page Title ────────────────────────────────────────── */
    .page-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .page-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-bottom: 28px;
    }

    /* ─── Stats Grid ────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, background 0.2s;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--card-accent, var(--accent));
      border-radius: 0 0 0 var(--radius-lg);
    }
    .stat-card:hover {
      border-color: var(--border-light);
      background: var(--bg-raised);
    }
    .stat-label {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .stat-value {
      font-size: 2rem;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .stat-sub {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin-top: 8px;
    }
    #stat-card-total    { --card-accent: var(--accent); }
    #stat-card-pending  { --card-accent: var(--amber); }
    #stat-card-shipped  { --card-accent: var(--green); }
    #stat-card-revenue  { --card-accent: var(--purple); }

    /* ─── Section Header ────────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.01em;
    }

    /* ─── Filter Bar ────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .filter-label {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }
    select#filter-status {
      background: var(--bg-raised);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 0.8rem;
      font-family: var(--font-mono);
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    select#filter-status:focus { border-color: var(--accent); }

    /* ─── Button ────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-light);
    }
    .btn-ghost:hover { background: var(--bg-raised); color: var(--text-primary); }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; }

    /* ─── Orders Table ──────────────────────────────────────── */
    .table-container {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 28px;
    }
    table#orders-table {
      width: 100%;
      border-collapse: collapse;
    }
    #orders-table thead tr {
      background: var(--bg-raised);
      border-bottom: 1px solid var(--border);
    }
    #orders-table th {
      text-align: left;
      padding: 11px 16px;
      font-size: 0.7rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }
    #orders-table td {
      padding: 13px 16px;
      font-size: 0.82rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    #orders-table tbody tr:last-child td { border-bottom: none; }
    #orders-table tbody tr { transition: background 0.12s; }
    #orders-table tbody tr:hover { background: var(--bg-hover); }
    .cell-mono {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .cell-primary { font-weight: 500; color: var(--text-primary); }

    /* ─── Status Badges ─────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-family: var(--font-mono);
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .badge-pending     { background: rgba(245,158,11,0.12);  color: var(--amber); border: 1px solid rgba(245,158,11,0.25); }
    .badge-confirmed   { background: rgba(59,130,246,0.12);  color: var(--accent); border: 1px solid rgba(59,130,246,0.25); }
    .badge-processing  { background: rgba(6,182,212,0.12);   color: var(--cyan); border: 1px solid rgba(6,182,212,0.25); }
    .badge-shipped     { background: rgba(16,185,129,0.12);  color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
    .badge-delivered   { background: rgba(139,92,246,0.12);  color: var(--purple); border: 1px solid rgba(139,92,246,0.25); }
    .badge-cancelled   { background: rgba(239,68,68,0.12);   color: var(--red); border: 1px solid rgba(239,68,68,0.25); }

    /* ─── Empty State ───────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }
    .empty-state .empty-icon {
      font-size: 2rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .empty-state p {
      font-size: 0.82rem;
      font-family: var(--font-mono);
    }

    /* ─── Create Order Panel ────────────────────────────────── */
    .panel-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 24, 0.8);
      z-index: 200;
      backdrop-filter: blur(4px);
      align-items: flex-start;
      justify-content: flex-end;
    }
    .panel-overlay.open { display: flex; }
    .panel {
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      width: 420px;
      height: 100vh;
      overflow-y: auto;
      padding: 28px 24px;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    .panel-overlay.open .panel { transform: translateX(0); }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .panel-title {
      font-size: 1rem;
      font-weight: 700;
    }
    .panel-close {
      background: none;
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      border-radius: var(--radius);
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      transition: background 0.12s, color 0.12s;
    }
    .panel-close:hover { background: var(--bg-hover); color: var(--text-primary); }

    /* ─── Form ──────────────────────────────────────────────── */
    form#create-order-form { display: flex; flex-direction: column; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .form-input, .form-select, .form-textarea {
      background: var(--bg-raised);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 0.85rem;
      padding: 9px 12px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .form-input::placeholder { color: var(--text-dim); }
    .form-textarea { resize: vertical; min-height: 70px; }

    /* ─── Order Items ───────────────────────────────────────── */
    .items-section { display: flex; flex-direction: column; gap: 8px; }
    .item-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
    }
    .item-row .form-input { padding: 7px 10px; }
    .btn-remove-item {
      background: none;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      color: var(--text-dim);
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
      transition: border-color 0.12s, color 0.12s;
    }
    .btn-remove-item:hover { border-color: var(--red); color: var(--red); }
    .btn-add-item {
      background: none;
      border: 1px dashed var(--border-light);
      border-radius: var(--radius);
      color: var(--text-muted);
      padding: 7px;
      font-size: 0.78rem;
      font-family: var(--font-mono);
      width: 100%;
      text-align: center;
      transition: border-color 0.12s, color 0.12s;
    }
    .btn-add-item:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── Alert / Toast ─────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--bg-raised);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 12px 18px;
      font-size: 0.82rem;
      font-family: var(--font-mono);
      color: var(--text-primary);
      display: none;
      z-index: 500;
      min-width: 240px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: opacity 0.2s;
    }
    #toast.toast-success { border-left: 3px solid var(--green); }
    #toast.toast-error   { border-left: 3px solid var(--red); }
    #toast.show { display: block; }

    /* ─── Responsive ────────────────────────────────────────── */
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr; }
      .main { padding: 20px 14px; }
      .panel { width: 100vw; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- ── Header ───────────────────────────────────────────── -->
  <header class="header">
    <a href="/" class="header-brand">
      <span class="dot"></span>
      ECommerce API
    </a>
    <div class="header-actions">
      <span class="header-badge" id="api-status">● LIVE</span>
      <button class="btn btn-primary btn-sm" id="open-create-order-btn" aria-label="Create new order">
        + New Order
      </button>
    </div>
  </header>

  <!-- ── Main Content ─────────────────────────────────────── -->
  <main class="main" id="main-content">

    <h1 class="page-title">Order Dashboard</h1>
    <p class="page-subtitle">GET /api/orders — real-time order management</p>

    <!-- Stat Cards -->
    <section id="stats-section" aria-label="Order statistics">
      <div class="stats-grid">
        <div class="stat-card" id="stat-card-total" data-testid="stat-total-orders">
          <div class="stat-label">Total Orders</div>
          <div class="stat-value" id="stat-total-orders">0</div>
          <div class="stat-sub">all time</div>
        </div>
        <div class="stat-card" id="stat-card-pending" data-testid="stat-pending">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="stat-pending">0</div>
          <div class="stat-sub">awaiting confirmation</div>
        </div>
        <div class="stat-card" id="stat-card-shipped" data-testid="stat-shipped">
          <div class="stat-label">Shipped</div>
          <div class="stat-value" id="stat-shipped">0</div>
          <div class="stat-sub">in transit</div>
        </div>
        <div class="stat-card" id="stat-card-revenue" data-testid="stat-revenue">
          <div class="stat-label">Revenue</div>
          <div class="stat-value" id="stat-revenue">$0</div>
          <div class="stat-sub">total value</div>
        </div>
      </div>
    </section>

    <!-- Orders Table Section -->
    <section id="orders-section" aria-label="Orders list">
      <div class="section-header">
        <span class="section-title">Orders</span>
        <div class="filter-bar">
          <span class="filter-label">Status:</span>
          <select id="filter-status" aria-label="Filter orders by status">
            <option value="">All</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table id="orders-table" aria-label="Orders table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Shipping Address</th>
              <th>Total</th>
              <th>Status</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <!-- rows injected by JS -->
          </tbody>
        </table>
        <div id="orders-empty" class="empty-state" style="display:none">
          <div class="empty-icon">📦</div>
          <p>No orders found</p>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- ── Create Order Panel ──────────────────────────────────── -->
<div class="panel-overlay" id="create-order-panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title" id="panel-title">Create Order</span>
      <button class="panel-close" id="close-panel-btn" aria-label="Close panel">✕</button>
    </div>

    <form id="create-order-form" novalidate>

      <div class="form-group">
        <label class="form-label" for="customer-name">Customer Name</label>
        <input
          class="form-input"
          type="text"
          id="customer-name"
          name="customerName"
          placeholder="Jane Smith"
          autocomplete="off"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="shipping-address">Shipping Address</label>
        <textarea
          class="form-textarea"
          id="shipping-address"
          name="shippingAddress"
          placeholder="123 Main St, Springfield, IL 62701"
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Order Items</label>
        <div class="items-section" id="order-items-container">
          <div class="item-row" data-item-row>
            <input class="form-input" type="number" name="productId[]" placeholder="Product ID" min="1" required />
            <input class="form-input" type="number" name="quantity[]" placeholder="Qty" min="1" value="1" style="width:70px;" required />
            <button type="button" class="btn-remove-item" aria-label="Remove item">✕</button>
          </div>
        </div>
        <button type="button" class="btn-add-item" id="add-item-btn">+ Add Item</button>
      </div>

      <div class="form-group">
        <label class="form-label" for="coupon-code">Coupon Code <span style="opacity:0.5">(optional)</span></label>
        <input
          class="form-input"
          type="text"
          id="coupon-code"
          name="couponCode"
          placeholder="SAVE10"
          autocomplete="off"
        />
      </div>

      <div id="form-error" style="font-size:0.78rem;color:var(--red);font-family:var(--font-mono);display:none;"></div>

      <button type="submit" class="btn btn-primary" id="submit-order" style="margin-top:4px;">
        Place Order
      </button>

    </form>
  </div>
</div>

<!-- ── Toast ───────────────────────────────────────────────── -->
<div id="toast" role="status" aria-live="polite"></div>

<script>
  /* ─────────────────────────────────────────────────────────────
   * Demo seed data — used when API is unavailable / unauthenticated.
   * Playwright tests work against this predictable dataset.
   * ───────────────────────────────────────────────────────────── */
  const SEED_ORDERS = [
    { id: 1001, customer: 'Alice Johnson',  shippingAddress: '42 Maple Ave, Chicago, IL 60601',   total: 149.99, status: 'delivered',  createdAt: '2026-04-20T10:15:00Z' },
    { id: 1002, customer: 'Bob Martinez',   shippingAddress: '8 Pine Rd, Austin, TX 73301',        total: 89.50,  status: 'shipped',    createdAt: '2026-04-22T08:45:00Z' },
    { id: 1003, customer: 'Carol White',    shippingAddress: '15 Oak Blvd, Seattle, WA 98101',     total: 230.00, status: 'processing', createdAt: '2026-04-24T14:30:00Z' },
    { id: 1004, customer: 'David Lee',      shippingAddress: '3 Birch Lane, Boston, MA 02101',     total: 59.99,  status: 'confirmed',  createdAt: '2026-04-25T09:00:00Z' },
    { id: 1005, customer: 'Eva Nguyen',     shippingAddress: '77 Cedar St, Denver, CO 80201',      total: 410.75, status: 'pending',    createdAt: '2026-04-28T16:20:00Z' },
    { id: 1006, customer: 'Frank Torres',   shippingAddress: '21 Elm Court, Miami, FL 33101',      total: 32.00,  status: 'cancelled',  createdAt: '2026-04-15T11:10:00Z' },
    { id: 1007, customer: 'Grace Kim',      shippingAddress: '9 Willow Way, Portland, OR 97201',   total: 175.25, status: 'pending',    createdAt: '2026-04-29T07:05:00Z' },
    { id: 1008, customer: 'Henry Zhang',    shippingAddress: '56 Spruce Ct, Phoenix, AZ 85001',    total: 320.00, status: 'shipped',    createdAt: '2026-04-27T13:00:00Z' },
  ];

  /* ─────────────────────────────────────────────────────────────
   * State
   * ───────────────────────────────────────────────────────────── */
  let allOrders = [];
  let currentFilter = '';

  /* ─────────────────────────────────────────────────────────────
   * Helpers
   * ───────────────────────────────────────────────────────────── */
  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function formatCurrency(n) {
    return '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show toast-' + type;
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.className = ''; }, 3200);
  }

  /* ─────────────────────────────────────────────────────────────
   * Stats
   * ───────────────────────────────────────────────────────────── */
  function updateStats(orders) {
    const total    = orders.length;
    const pending  = orders.filter(o => o.status === 'pending').length;
    const shipped  = orders.filter(o => o.status === 'shipped').length;
    const revenue  = orders
      .filter(o => o.status !== 'cancelled')
      .reduce((acc, o) => acc + Number(o.total), 0);

    document.getElementById('stat-total-orders').textContent = total;
    document.getElementById('stat-pending').textContent      = pending;
    document.getElementById('stat-shipped').textContent      = shipped;
    document.getElementById('stat-revenue').textContent      = formatCurrency(revenue);
  }

  /* ─────────────────────────────────────────────────────────────
   * Table
   * ───────────────────────────────────────────────────────────── */
  function renderOrders(orders) {
    const tbody = document.getElementById('orders-tbody');
    const empty = document.getElementById('orders-empty');
    const table = document.getElementById('orders-table');

    const filtered = currentFilter
      ? orders.filter(o => o.status === currentFilter)
      : orders;

    tbody.innerHTML = '';

    if (filtered.length === 0) {
      table.style.display = 'none';
      empty.style.display  = 'block';
      return;
    }

    table.style.display = '';
    empty.style.display  = 'none';

    filtered.forEach(order => {
      const tr = document.createElement('tr');
      tr.dataset.orderId = order.id;
      tr.dataset.status  = order.status;
      tr.innerHTML = `
        <td class="cell-mono">#${order.id}</td>
        <td class="cell-primary">${escapeHtml(order.customer || order.userId || '—')}</td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted);font-size:0.78rem;"
            title="${escapeHtml(order.shippingAddress)}">${escapeHtml(order.shippingAddress)}</td>
        <td class="cell-mono">${formatCurrency(order.total)}</td>
        <td><span class="badge badge-${order.status}" data-status="${order.status}">${order.status}</span></td>
        <td class="cell-mono" style="color:var(--text-dim)">${formatDate(order.createdAt)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function escapeHtml(str) {
    str = String(str ?? '');
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ─────────────────────────────────────────────────────────────
   * Load Orders — prefer seed data (no auth needed), fall back to API
   * ───────────────────────────────────────────────────────────── */
  async function loadOrders() {
    try {
      const token = localStorage.getItem('auth_token');
      if (token) {
        const res = await fetch('/api/orders', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          const rows = Array.isArray(data) ? data : (data.orders || data.data || []);
          allOrders = rows;
          updateStats(allOrders);
          renderOrders(allOrders);
          document.getElementById('api-status').textContent = '● LIVE';
          return;
        }
      }
    } catch (_) { /* fall through to seed */ }

    // Use seed data for demo / unauthenticated usage
    allOrders = SEED_ORDERS;
    document.getElementById('api-status').textContent = '● DEMO';
    updateStats(allOrders);
    renderOrders(allOrders);
  }

  /* ─────────────────────────────────────────────────────────────
   * Create Order (panel form)
   * ───────────────────────────────────────────────────────────── */
  async function handleCreateOrder(e) {
    e.preventDefault();
    const form    = document.getElementById('create-order-form');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-order');
    errorEl.style.display = 'none';

    const customerName    = form.querySelector('#customer-name').value.trim();
    const shippingAddress = form.querySelector('#shipping-address').value.trim();
    const couponCode      = form.querySelector('#coupon-code').value.trim();

    if (!customerName) {
      errorEl.textContent = 'Customer name is required.';
      errorEl.style.display = 'block';
      return;
    }
    if (shippingAddress.length < 10) {
      errorEl.textContent = 'Shipping address must be at least 10 characters.';
      errorEl.style.display = 'block';
      return;
    }

    // Collect items
    const rows = form.querySelectorAll('[data-item-row]');
    const items = [];
    for (const row of rows) {
      const pid = parseInt(row.querySelector('[name="productId[]"]').value, 10);
      const qty = parseInt(row.querySelector('[name="quantity[]"]').value, 10);
      if (!pid || !qty) {
        errorEl.textContent = 'All items must have a valid Product ID and Quantity.';
        errorEl.style.display = 'block';
        return;
      }
      items.push({ productId: pid, quantity: qty });
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Placing…';

    try {
      const token = localStorage.getItem('auth_token');
      if (token) {
        const res = await fetch('/api/orders', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body:    JSON.stringify({ shippingAddress, items, couponCode: couponCode || undefined }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || err.message || `HTTP ${res.status}`);
        }
        const created = await res.json();
        allOrders.unshift({ ...created, customer: customerName });
      } else {
        // Demo mode — add locally
        const newOrder = {
          id:              Math.floor(2000 + Math.random() * 8000),
          customer:        customerName,
          shippingAddress: shippingAddress,
          total:           items.reduce((s, i) => s + i.quantity * 29.99, 0).toFixed(2),
          status:          'pending',
          createdAt:       new Date().toISOString(),
        };
        allOrders.unshift(newOrder);
      }

      updateStats(allOrders);
      renderOrders(allOrders);
      closePanelFn();
      showToast('Order created successfully', 'success');
      form.reset();
      // Reset items to one blank row
      resetItemRows();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Place Order';
    }
  }

  /* ─────────────────────────────────────────────────────────────
   * Order Items management
   * ───────────────────────────────────────────────────────────── */
  function createItemRow() {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.dataset.itemRow = '';
    row.innerHTML = `
      <input class="form-input" type="number" name="productId[]" placeholder="Product ID" min="1" required />
      <input class="form-input" type="number" name="quantity[]" placeholder="Qty" min="1" value="1" style="width:70px;" required />
      <button type="button" class="btn-remove-item" aria-label="Remove item">✕</button>
    `;
    row.querySelector('.btn-remove-item').addEventListener('click', () => {
      const container = document.getElementById('order-items-container');
      if (container.querySelectorAll('[data-item-row]').length > 1) row.remove();
    });
    return row;
  }

  function resetItemRows() {
    const container = document.getElementById('order-items-container');
    container.innerHTML = '';
    container.appendChild(createItemRow());
  }

  /* ─────────────────────────────────────────────────────────────
   * Panel open / close
   * ───────────────────────────────────────────────────────────── */
  function openPanelFn() {
    const overlay = document.getElementById('create-order-panel');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    overlay.querySelector('#customer-name').focus();
  }

  function closePanelFn() {
    const overlay = document.getElementById('create-order-panel');
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  /* ─────────────────────────────────────────────────────────────
   * Event wiring
   * ───────────────────────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {

    // Load data
    loadOrders();

    // "+ New Order" button
    document.getElementById('open-create-order-btn').addEventListener('click', openPanelFn);

    // Close panel
    document.getElementById('close-panel-btn').addEventListener('click', closePanelFn);
    document.getElementById('create-order-panel').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closePanelFn();
    });

    // Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePanelFn();
    });

    // Filter
    document.getElementById('filter-status').addEventListener('change', (e) => {
      currentFilter = e.target.value;
      renderOrders(allOrders);
    });

    // Add item button
    document.getElementById('add-item-btn').addEventListener('click', () => {
      const container = document.getElementById('order-items-container');
      const row = createItemRow();
      container.appendChild(row);
    });

    // Attach remove handler to initial row
    document.querySelectorAll('[data-item-row] .btn-remove-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const container = document.getElementById('order-items-container');
        if (container.querySelectorAll('[data-item-row]').length > 1) btn.closest('[data-item-row]').remove();
      });
    });

    // Form submit
    document.getElementById('create-order-form').addEventListener('submit', handleCreateOrder);

  });
</script>
</body>
</html>
